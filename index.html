<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Razaullah Fan's | Cricket</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #070b09;
            color: white;
        }

        /* TOP HEADER */
        .header {
            background: #0b1510;
            border-bottom: 1px solid #1d3d2b;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #16a05a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .brand h1 {
            font-size: 22px;
        }

        .brand h1 span {
            color: #20c878;
        }

        .tagline {
            color: #8fa198;
            font-size: 12px;
        }

        /* NAVIGATION */
        .navigation {
            background: #101a14;
            border-bottom: 1px solid #1d3d2b;
            overflow-x: auto;
        }

        .nav-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
        }

        .nav-inner a {
            color: #d8dfda;
            text-decoration: none;
            padding: 16px 17px;
            font-size: 14px;
            white-space: nowrap;
        }

        .nav-inner a:hover,
        .nav-inner a.active {
            background: #16a05a;
            color: white;
        }

        /* HERO */
        .hero {
            background:
                linear-gradient(90deg, #050806, rgba(5, 30, 18, .85)),
                radial-gradient(circle at right, #176b3c, #07100b 65%);

            min-height: 390px;
            display: flex;
            align-items: center;
        }

        .hero-inner {
            max-width: 1200px;
            width: 100%;
            margin: auto;
            padding: 70px 20px;
        }

        .hero small {
            color: #20c878;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .hero h2 {
            font-size: 50px;
            max-width: 700px;
            margin: 14px 0;
        }

        .hero h2 span {
            color: #20c878;
        }

        .hero p {
            max-width: 620px;
            color: #b8c4bd;
            font-size: 17px;
            line-height: 1.7;
        }

        .buttons {
            margin-top: 25px;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 6px;
            margin-right: 8px;
            font-weight: bold;
        }

        .green-button {
            background: #16a05a;
            color: white;
        }

        .dark-button {
            background: #101a14;
            color: white;
            border: 1px solid #2a4c38;
        }

        /* GENERAL */
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        .title {
            font-size: 25px;
            margin-bottom: 22px;
            border-left: 4px solid #16a05a;
            padding-left: 12px;
        }

        /* LIVE MATCHES */
        .match-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .match-card {
            background: #101713;
            border: 1px solid #1d3829;
            border-radius: 10px;
            padding: 20px;
        }

        .live {
            color: #ff5252;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .team {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1c2b22;
        }

        .score {
            color: #20c878;
            font-weight: bold;
        }

        .match-status {
            color: #89978f;
            font-size: 13px;
            margin-top: 15px;
        }

        /* NEWS */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .news-card {
            background: #101713;
            border: 1px solid #1d3829;
            border-radius: 10px;
            overflow: hidden;
        }

        .news-photo {
            height: 160px;
            background: linear-gradient(135deg, #145b35, #07100b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }

        .news-content {
            padding: 18px;
        }

        .news-content h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .news-content p {
            color: #9aa69f;
            font-size: 14px;
            line-height: 1.6;
        }

        /* LISTS */
        .list-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .list-card {
            background: #101713;
            border: 1px solid #1d3829;
            border-radius: 10px;
            overflow: hidden;
        }

        .list-row {
            padding: 17px;
            border-bottom: 1px solid #1d2a22;
            display: flex;
            justify-content: space-between;
        }

        .list-row:last-child {
            border-bottom: none;
        }

        .green-text {
            color: #20c878;
        }

        /* TEAMS */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .team-box {
            background: #101713;
            border: 1px solid #1d3829;
            border-radius: 10px;
            padding: 25px 15px;
            text-align: center;
        }

        .team-box .flag {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .team-box p {
            color: #89978f;
            font-size: 13px;
            margin-top: 6px;
        }

        /* VIDEO */
        .video-box {
            background: #101713;
            border: 1px solid #1d3829;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
        }

        .play {
            width: 70px;
            height: 70px;
            background: #16a05a;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .video-box h3 {
            margin-top: 15px;
        }

        .video-box p {
            color: #89978f;
            margin-top: 8px;
        }

        /* FOOTER */
        footer {
            background: #040705;
            border-top: 1px solid #1d3d2b;
            margin-top: 30px;
        }

        .footer-inner {
            max-width: 1200px;
            margin: auto;
            padding: 35px 20px;
            text-align: center;
        }

        .footer-inner h2 {
            margin-bottom: 10px;
        }

        .footer-inner span {
            color: #20c878;
        }

        .footer-inner p {
            color: #78857d;
            margin-top: 10px;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            .hero h2 {
                font-size: 35px;
            }

            .match-grid,
            .news-grid,
            .list-grid {
                grid-template-columns: 1fr;
            }

            .team-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .tagline {
                display: none;
            }
        }

        @media (max-width: 500px) {

            .brand h1 {
                font-size: 18px;
            }

            .hero {
                min-height: 330px;
            }

            .hero-inner {
                padding: 50px 20px;
            }

            .team-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
